<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0e1a">
<title>记忆宫殿 · 轻量控制台</title>
<style>
:root{
  --bg:#0b0e1a; --bg2:#11162a; --bg3:#171d36; --bd:#232b4d; --bd2:#2e3a6e;
  --tx:#e6e9f5; --tx2:#9aa3c7; --tx3:#5c6690;
  --ac:#5b8cff; --ac2:#7c5bff; --ok:#34d399; --warn:#fbbf24; --err:#f87171;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Roboto,sans-serif;font-size:14px;line-height:1.6;overflow-x:hidden}
a{color:var(--ac);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}

/* ===== 布局 ===== */
#app{display:flex;min-height:100vh}
#sidebar{width:232px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 10px;z-index:50}
#main{flex:1;min-width:0;padding:16px 20px 80px;max-width:1100px;margin:0 auto}
@media (max-width:900px){
  #app{flex-direction:column}
  #sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;height:auto;border-right:none;border-top:1px solid var(--bd);display:flex;overflow-x:auto;padding:6px 4px;z-index:100;background:rgba(17,22,42,.96);backdrop-filter:blur(8px)}
  #main{padding:12px 12px 76px}
}
@media (min-width:901px){ #mobileBar{display:none} }

/* ===== 顶栏 ===== */
#topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
#brand{display:flex;align-items:center;gap:10px}
#brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;font-size:18px}
#brand h1{font-size:18px;font-weight:700;letter-spacing:.5px}
#brand p{font-size:11px;color:var(--tx2)}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ===== 导航 ===== */
#nav{display:flex;flex-direction:column;gap:2px}
@media (max-width:900px){ #nav{flex-direction:row;gap:4px} }
#nav .grp{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;margin:10px 8px 4px}
@media (max-width:900px){ #nav .grp{display:none} }
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:var(--tx2);cursor:pointer;border:1px solid transparent;font-size:13px;white-space:nowrap;transition:all .15s;user-select:none}
.nav-item:hover{background:var(--bg3);color:var(--tx)}
.nav-item.active{background:linear-gradient(135deg,rgba(91,140,255,.16),rgba(124,91,255,.12));border-color:var(--bd2);color:var(--ac)}
.nav-item .ic{width:18px;text-align:center;font-size:14px}
@media (max-width:900px){
  .nav-item{padding:7px 10px;font-size:12px}
  .nav-item .lbl{display:none}
  .nav-item .lbl.show{display:inline}
}

/* ===== 卡片与区块 ===== */
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h2{font-size:15px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card h2 .ic{font-size:15px}
.card .sub{font-size:12px;color:var(--tx2);margin-bottom:12px}
.card .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){ .grid-2,.grid-3,.grid-4{grid-template-columns:1fr} .grid-3{grid-template-columns:repeat(2,1fr)} }

/* ===== 统计卡 ===== */
.stat{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--radius);padding:14px 16px}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat .k{font-size:11px;color:var(--tx2);margin-top:2px}

/* ===== 表格 ===== */
.tbl-wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{background:var(--bg3);color:var(--tx2);font-weight:600;position:sticky;top:0}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(91,140,255,.05)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* ===== 表单 ===== */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--tx2);margin-bottom:5px}
input,select,textarea{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--bd2);background:var(--bg3);color:var(--tx);font-size:13px;font-family:inherit;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
textarea{min-height:70px;resize:vertical}
.frow{display:flex;gap:10px;flex-wrap:wrap}
.frow > *{flex:1;min-width:140px}

/* ===== 按钮 ===== */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid var(--bd2);color:var(--tx2)}
.btn-ghost:hover{border-color:var(--ac);color:var(--ac);background:none}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-ok{background:linear-gradient(135deg,#059669,#34d399)}
.btn-danger{background:linear-gradient(135deg,#b91c1c,#f87171)}

/* ===== 徽章 ===== */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid transparent}
.b-ok{background:rgba(52,211,153,.12);color:var(--ok);border-color:rgba(52,211,153,.3)}
.b-warn{background:rgba(251,191,36,.12);color:var(--warn);border-color:rgba(251,191,36,.3)}
.b-err{background:rgba(248,113,113,.12);color:var(--err);border-color:rgba(248,113,113,.3)}
.b-info{background:rgba(91,140,255,.12);color:var(--ac);border-color:rgba(91,140,255,.3)}

/* ===== 状态条 ===== */
#statusline{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin-bottom:14px;font-size:12px;color:var(--tx2)}
#statusline .dot{width:8px;height:8px;border-radius:50%;background:var(--tx3);flex-shrink:0}
#statusline .dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
#statusline .dot.off{background:var(--err)}
#statusline .sep{color:var(--bd2)}

/* ===== 空态/加载/错误 ===== */
.empty{text-align:center;padding:34px 16px;color:var(--tx3);font-size:13px}
.empty .big{font-size:34px;margin-bottom:8px}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:30px;color:var(--tx2);font-size:13px}
.spin{width:18px;height:18px;border:2px solid var(--bd2);border-top-color:var(--ac);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err-box{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3);color:var(--err);border-radius:10px;padding:12px 14px;font-size:12.5px;margin-bottom:12px;word-break:break-all}
.ok-box{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.3);color:var(--ok);border-radius:10px;padding:12px 14px;font-size:12.5px;margin-bottom:12px;word-break:break-all}

/* ===== Toast ===== */
#toasts{position:fixed;top:14px;right:14px;z-index:999;display:flex;flex-direction:column;gap:8px;max-width:min(340px,80vw)}
.toast{background:var(--bg3);border:1px solid var(--bd2);border-left:3px solid var(--ac);border-radius:8px;padding:10px 14px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .2s ease;word-break:break-all}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--err)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ===== 模态 ===== */
#modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:200;padding:16px;backdrop-filter:blur(2px)}
#modal-bg.show{display:flex}
#modal{background:var(--bg2);border:1px solid var(--bd2);border-radius:14px;width:100%;max-width:520px;max-height:84vh;overflow-y:auto;padding:20px}
#modal h3{font-size:16px;margin-bottom:4px}
#modal .sub{font-size:12px;color:var(--tx2);margin-bottom:14px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

/* ===== 热力图 ===== */
.hm-grid{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.hm-cell{aspect-ratio:1;border-radius:3px;background:var(--bg3);min-width:8px}
.hm-cell.l0{background:#1a2240}.hm-cell.l1{background:#22336b}.hm-cell.l2{background:#2b4a9e}.hm-cell.l3{background:#3b6cd6}.hm-cell.l4{background:#5b8cff}.hm-cell.l5{background:#a78bfa}
.hm-legend{display:flex;gap:4px;align-items:center;font-size:10px;color:var(--tx3);margin-top:6px}
.hm-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* ===== 词条/树 ===== */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--bg3);border:1px solid var(--bd);padding:3px 10px;border-radius:16px;font-size:12px;color:var(--tx2)}
.chip b{color:var(--tx);font-weight:600}
.ring{width:150px;height:150px;margin:0 auto}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.flow .node{background:var(--bg3);border:1px solid var(--bd2);padding:4px 12px;border-radius:16px;font-size:12.5px}
.flow .arr{color:var(--tx3);font-size:12px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--bd);font-size:12.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--tx2)}
.kv .v{color:var(--tx);font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;word-break:break-all;text-align:right}
pre.out{background:var(--bg3);border:1px solid var(--bd);border-radius:8px;padding:12px;font-size:11.5px;overflow-x:auto;max-height:280px;color:var(--tx2);font-family:ui-monospace,monospace;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar"><nav id="nav"></nav></aside>
  <div id="main">
    <div id="topbar">
      <div id="brand">
        <div class="logo">🏛️</div>
        <div><h1>记忆宫殿</h1><p id="netLabel">轻量控制台 · 边缘网络</p></div>
      </div>
      <div class="top-actions">
        <span id="connBadge" class="badge b-warn">连接中…</span>
        <button class="btn btn-ghost btn-sm" onclick="openSettings()">⚙️ 设置</button>
      </div>
    </div>
    <div id="statusline">
      <span class="dot" id="sdot"></span><span id="sstat">初始化…</span>
      <span class="sep">|</span><span id="snode">节点 —</span>
      <span class="sep">|</span><span id="swallet">未登录</span>
    </div>
    <div id="page"></div>
  </div>
</div>

<div id="modal-bg" onclick="if(event.target===this)closeModal()"><div id="modal"></div></div>
<div id="toasts"></div>

<script>
'use strict';
/* ============================================================
 * 记忆宫殿 · 轻量控制台
 * 零依赖原生 JS · 响应式 · 多端点就近选择 + 故障切换
 * ============================================================ */

/* ---------- 配置 ---------- */
const VERSION = '3.1.0';
const PROBE_PATH = '/api/palace/status';
const PROBE_TIMEOUT = 2500;

/* 候选端点（构建时可注入：VITE_API_ORIGINS=url1,url2）。留空 = 同源 */
const BUILTIN_ORIGINS = (window.__API_ORIGINS__ || '').split(',').map(s=>s.trim().replace(/\/+$/,'')).filter(Boolean);

const LS = {
  origins: 'mpc_origins',   // 用户自定义端点（JSON）
  wallet: 'mpc_wallet',
  key: 'mpc_api_key',
  cache: 'mpc_cache_v1',
};

/* ---------- 状态 ---------- */
const store = {
  origins: [],
  currentIdx: -1,
  wallet: localStorage.getItem(LS.wallet) || '',
  apiKey: localStorage.getItem(LS.key) || '',
  status: null,          // palace/status 缓存
  userCache: {},         // 各领域数据缓存 { key: {t, data} }
};

/* ---------- 工具 ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (v, d=2) => { const n = Number(v); return isFinite(n) ? n.toFixed(d) : '—'; };
const fmtTime = (ts) => { if(!ts) return '—'; const d = new Date(ts); return isNaN(d) ? String(ts) : d.toLocaleString('zh-CN',{hour12:false}); };
const maskWallet = (w) => { if(!w) return '—'; if(w.length <= 12) return w; return w.slice(0,6)+'…'+w.slice(-4); };
const safeText = (s) => { const t = String(s ?? ''); return /[\uFFFD?]{2,}/.test(t) && !/[\u4e00-\u9fa5]/.test(t) ? '(历史数据编码异常)' : t; };

function toast(msg, type='') {
  const el = document.createElement('div');
  el.className = 'toast '+type;
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function setStatus(text, ok) {
  $('sstat').textContent = text;
  const dot = $('sdot');
  dot.className = 'dot ' + (ok === true ? 'on' : ok === false ? 'off' : '');
}
function setConn(text, ok) {
  const b = $('connBadge');
  b.textContent = text;
  b.className = 'badge ' + (ok === true ? 'b-ok' : ok === false ? 'b-err' : 'b-warn');
}
function refreshWalletLine() {
  $('swallet').textContent = store.wallet ? '👛 '+maskWallet(store.wallet) : '未登录';
}

/* ---------- 多端点探测与故障切换 ---------- */
function loadOrigins() {
  let custom = [];
  try { custom = JSON.parse(localStorage.getItem(LS.origins) || '[]'); } catch {}
  if (!Array.isArray(custom)) custom = [];
  const merged = [...new Set([...custom, ...BUILTIN_ORIGINS])];
  store.origins = merged;
  return merged;
}

async function pingOrigin(origin) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), PROBE_TIMEOUT);
  const t0 = performance.now();
  try {
    const res = await fetch(origin + PROBE_PATH, { headers: {'Content-Type':'application/json'}, signal: ctrl.signal });
    if (!res.ok) return null;
    return performance.now() - t0;
  } catch { return null; } finally { clearTimeout(timer); }
}

let probing = null;
async function ensureProbed(force=false) {
  if (store.origins.length === 0) { store.currentIdx = -1; return; }
  if (!force && store.currentIdx >= 0) return;
  if (probing) return probing;
  probing = (async () => {
    const results = await Promise.all(store.origins.map(async (o) => ({ o, t: await pingOrigin(o) })));
    const alive = results.filter(r => r.t !== null).sort((a,b) => a.t - b.t);
    if (alive.length) {
      store.currentIdx = store.origins.indexOf(alive[0].o);
      setConn('就近节点 '+alive[0].t.toFixed(0)+'ms', true);
      $('snode').textContent = '节点 ' + alive[0].o.replace(/^https?:\/\//,'');
    } else {
      store.currentIdx = -1;
      setConn('同源回退', false);
      $('snode').textContent = '同源（探测失败）';
    }
    probing = null;
  })();
  return probing;
}

function failover() {
  if (store.origins.length === 0) return false;
  const next = (store.currentIdx + 1) % store.origins.length;
  if (next === store.currentIdx) return false;
  store.currentIdx = next;
  return true;
}

function resolveUrl(path) {
  return store.currentIdx >= 0 ? store.origins[store.currentIdx] + path : path;
}

/* ---------- API 请求层 ---------- */
async function api(method, path, body, adminKey) {
  await ensureProbed();
  const origins = store.origins;
  const attempts = Math.max(1, origins.length);
  for (let i = 0; i <= attempts; i++) {
    const headers = { 'Content-Type': 'application/json' };
    if (adminKey) headers['X-API-Key'] = adminKey;
    else if (store.apiKey) headers['X-API-Key'] = store.apiKey;
    let res;
    try {
      res = await fetch(resolveUrl(path), {
        method,
        headers,
        body: body !== undefined ? JSON.stringify(body) : undefined,
      });
    } catch (e) {
      if (failover()) continue;
      throw new Error('网络请求失败：' + e.message);
    }
    if (res.status === 401) throw new Error('API Key 无效或已过期，请到设置中更新');
    if (res.status === 403) throw new Error('权限不足：API Key 与钱包不匹配，请绑定正确的钱包 API Key');
    if (res.status === 429) throw new Error('请求过于频繁，请稍后再试');
    if (res.status >= 500 && failover()) continue;
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    return data;
  }
  throw new Error('所有 API 节点均不可用');
}

/* ---------- 数据缓存（写操作后失效） ---------- */
function cacheGet(k) { const c = store.userCache[k]; return c && (Date.now()-c.t < 8000) ? c.data : null; }
function cacheSet(k, data) { store.userCache[k] = { t: Date.now(), data }; }
function cacheBust() { store.userCache = {}; }

async function loadJSON(key, path) {
  const hit = cacheGet(key);
  if (hit) return hit;
  const data = await api('GET', path);
  cacheSet(key, data);
  return data;
}

/* ---------- 页面渲染骨架 ---------- */
function card(title, icon, sub, inner) {
  return '<div class="card"><h2><span class="ic">'+icon+'</span>'+esc(title)+'</h2>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'<div>'+inner+'</div></div>';
}
function statCards(items) {
  return '<div class="grid grid-4">'+items.map(i => '<div class="stat"><div class="v">'+i.v+'</div><div class="k">'+esc(i.k)+'</div></div>').join('')+'</div>';
}
function table(headers, rows) {
  if (!rows || !rows.length) return '<div class="empty"><div class="big">📭</div>暂无数据</div>';
  return '<div class="tbl-wrap"><table><thead><tr>'+headers.map(h=>'<th'+(h.num?' class="num"':'')+'>'+esc(h.t)+'</th>').join('')+'</tr></thead><tbody>'+
    rows.map(r => '<tr>'+r.map((c,i)=>'<td'+(headers[i]&&headers[i].num?' class="num"':'')+'>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}
function spinner(text) { return '<div class="loading"><div class="spin"></div>'+esc(text||'加载中…')+'</div>'; }
function empty(text) { return '<div class="empty"><div class="big">📭</div>'+esc(text||'暂无数据')+'</div>'; }
function errBox(e) { return '<div class="err-box">⚠️ '+esc(e.message || String(e))+'</div>'; }
function okBox(t) { return '<div class="ok-box">✅ '+esc(t)+'</div>'; }
function badge(status) {
  const s = String(status||'').toLowerCase();
  if (['active','online','success','completed','enabled','verified','done','alive'].includes(s)) return '<span class="badge b-ok">'+esc(status)+'</span>';
  if (['offline','failed','error','expired','disabled','denied','inactive'].includes(s)) return '<span class="badge b-err">'+esc(status)+'</span>';
  if (['pending','claimed','executing','submitted','processing'].includes(s)) return '<span class="badge b-warn">'+esc(status)+'</span>';
  return '<span class="badge b-info">'+esc(status)+'</span>';
}
function btn(label, code, cls) { return '<button class="btn btn-sm '+(cls||'')+'" onclick="'+code+'">'+label+'</button>'; }

/* ---------- 模态 ---------- */
function openModal(title, sub, body, foot) {
  $('modal').innerHTML = '<h3>'+esc(title)+'</h3><div class="sub">'+esc(sub||'')+'</div>'+body+'<div class="modal-foot">'+ (foot||'<button class="btn btn-ghost" onclick="closeModal()">关闭</button>') +'</div>';
  $('modal-bg').classList.add('show');
}
function closeModal() { $('modal-bg').classList.remove('show'); }
function q(id) { return $(id) ? $(id).value : ''; }

/* ============================================================
 * 页面定义
 * ============================================================ */
const pages = {};

/* ---------- 1. 仪表盘 ---------- */
pages.dashboard = {

async function loadWalletInfo() {
  if (!store.wallet) return toast('请先注册或绑定钱包','err');
  try { const d = await api('GET','/api/wallet/info?wallet='+encodeURIComponent(store.wallet)); toast('余额：'+num(d.balance,6)+' MC','ok'); }
  catch(e){ toast(e.message,'err'); }
  refresh();
}
async function doTransfer() {
  const to = q('txTo'), amt = parseFloat(q('txAmt'));
  if (!to || !amt) return toast('请填写目标钱包和数量','err');
  try { const d = await api('POST','/api/wallet/transfer',{wallet:store.wallet, to, amount:amt}); toast('转账成功：'+num(d.amount)+' MC','ok'); cacheBust(); refresh(); }
  catch(e){ toast(e.message,'err'); }
}
async function doDeposit() {
  const amt = parseFloat(q('txAmt'));
  if (!store.wallet || !amt) return toast('请先绑定钱包并填写数量','err');
  try { const d = await api('POST','/api/wallet/deposit',{wallet:store.wallet, amount:amt}); toast('已存入公池：'+num(d.net_amount,4)+' MC','ok'); cacheBust(); refresh(); }
  catch(e){ toast(e.message,'err'); }
}
async function doWithdraw() {
  const amt = parseFloat(q('txAmt'));
  if (!store.wallet || !amt) return toast('请先绑定钱包并填写数量','err');
  try { const d = await api('POST','/api/wallet/withdraw',{wallet:store.wallet, amount:amt}); toast('已提取：'+num(d.net_amount,4)+' MC','ok'); cacheBust(); refresh(); }
  catch(e){ toast(e.message,'err'); }
}

  catch(e){ toast(e.message,'err'); }
}

}

  try { const d = await api('GET','/api/memory/export'); const blob = new Blob([JSON.stringify(d,null,2)],{type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'memory-export-'+Date.now()+'.json'; a.click(); toast('导出成功','ok'); }
  catch(e){ toast(e.message,'err'); }
}

function openRegister() {

    '<div class="field"><label>邮箱（可选）</label><input id="regEmail" placeholder="用于找回 API Key"></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn" onclick="doRegister()">注册</button>');

async function doRegister() {
  let wallet = q('regWallet').trim() || generateWallet();
  const password = q('regPass'), email = q('regEmail').trim();
  if (password && password.length < 12) return toast('密码至少 12 位','err');
  try {
    const d = await api('POST','/api/wallet/register',{wallet, ...(password?{password}:{}), ...(email?{email}:{})});
    if (d.registered || d.already_registered) {
      store.wallet = wallet; store.apiKey = d.api_key || store.apiKey;
      localStorage.setItem(LS.wallet, wallet);
      if (d.api_key) localStorage.setItem(LS.key, d.api_key);
      toast('注册成功，钱包已保存','ok');
      closeModal(); refreshWalletLine(); refresh();
    } else { toast(d.error || d.message || '注册失败','err'); }
  } catch(e){ toast(e.message,'err'); }
}
function generateWallet() {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let s = 'WALLET_';
  for (let i=0;i<16;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

  openModal('绑定 API Key','输入钱包地址与 API Key',

    '<button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn" onclick="doLogin()">绑定</button>');
}
function doLogin() {
  const wallet = q('lgWallet').trim(), key = q('lgKey').trim();
  if (!wallet || !key) return toast('请填写钱包和 API Key','err');
  store.wallet = wallet; store.apiKey = key;
  localStorage.setItem(LS.wallet, wallet); localStorage.setItem(LS.key, key);

    '<div class="card" style="padding:12px"><h2>👤 账户</h2><div class="kv"><span class="k">钱包</span><span class="v">'+esc(maskWallet(store.wallet))+'</span></div>'+
    '<div class="kv"><span class="k">API Key</span><span class="v">'+esc(store.apiKey?store.apiKey.slice(0,8)+'…'+store.apiKey.slice(-4):'未设置')+'</span></div>'+
    '<div class="toolbar" style="margin-top:8px"><button class="btn btn-danger btn-sm" onclick="logout()">退出登录</button></div></div>'+
    '<div class="card" style="padding:12px"><h2>🤖 LLM 算力（钱包分身）</h2><div class="sub">用大模型 API Key 作为分身算力：后台自动完成任务挖矿/记忆挖矿/记忆优化，每日限额控制成本</div>'+
    '<div id="llmPanel">'+spinner('加载 LLM 算力状态…')+'</div></div>'+
    '<div class="card" style="padding:12px"><h2>📖 多端点配置说明</h2>'+
    '<details style="margin-top:8px"><summary style="cursor:pointer;font-size:12.5px;color:var(--ac)">点击查看：原理 · 配置方式 · 端点要求 · 行为表现</summary>'+
    '<div style="margin-top:10px;font-size:12px;line-height:1.8;color:var(--tx2)">'+
    '<b style="color:var(--tx)">原理</b>：启动时并发探测各端点 <code>/api/palace/status</code>，选延迟最低节点；网络失败或 5xx 自动切换下一节点；全部不可用回退同源。<br>'+
    '<b style="color:var(--tx)">方式 A（推荐·部署时）</b>：在 GitHub 仓库 Variables 设置 <code>VITE_API_ORIGINS=https://域名1,https://域名2</code>（逗号分隔，留空=同源），重新部署即注入。<br>'+
    '<b style="color:var(--tx)">方式 B（当前浏览器）</b>：在上方「🌐 API 端点」输入地址点击添加，自动就近切换，保存在本机。<br>'+
    '<b style="color:var(--tx)">端点要求</b>：HTTPS；必须实现 <code>GET /api/palace/status</code>；跨域需返回 CORS 头；各节点业务接口一致。<br>'+
    '<b style="color:var(--tx)">表现</b>：顶栏「就近节点 xxx ms」=多端点生效；「同源模式」=未配置；「同源（探测失败）」=全部端点不可达；401=API Key 无效；403=需管理员 Key；429=请求过频。<br>'+
    '<b style="color:var(--tx)">验证</b>：开发者工具 Console 无「所有 API 节点均不可用」即正常。</div></details></div>'+
    '<div class="card" style="padding:12px"><h2>ℹ️ 关于</h2><div class="sub">记忆宫殿轻量控制台 v'+VERSION+' · 零依赖 · 全部数据通过边缘节点 API 获取</div></div>',
    '<button class="btn" onclick="closeModal()">完成</button>');
  setTimeout(renderLlmPanel, 60);
}
function addOrigin() {
  const v = q('newOrigin').trim().replace(/\/+$/,'');
  if (!v) return toast('请输入端点地址','err');
  if (!/^https?:\/\//.test(v)) return toast('地址需以 http(s):// 开头','err');
  loadOrigins();
  if (!store.origins.includes(v)) { store.origins.push(v); localStorage.setItem(LS.origins, JSON.stringify(store.origins)); }
  store.currentIdx = -1; probing = null;
  toast('已添加端点，正在探测…','ok');
  ensureProbed(true).then(() => { closeModal(); refresh(); });
}
function removeOrigin(o) {
  loadOrigins();
  store.origins = store.origins.filter(x => x !== o);
  localStorage.setItem(LS.origins, JSON.stringify(store.origins));
  store.currentIdx = -1; probing = null;
  ensureProbed(true).then(refresh);
  closeModal();
}
function logout() {
  store.wallet = ''; store.apiKey = '';
  localStorage.removeItem(LS.wallet); localStorage.removeItem(LS.key);
  cacheBust(); toast('已退出登录','ok'); closeModal(); refreshWalletLine(); refresh();
}

/* ---------- LLM 算力（钱包分身：按钱包鉴权，无需管理员） ---------- */
const llmShort = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n) + '…' : s; };
async function renderLlmPanel(containerId) {
  const box = $(containerId || 'llmPanel');
  if (!box) return;
  if (!store.wallet) {
    box.innerHTML = '<div class="empty"><div class="big">👛</div>请先注册或绑定钱包后配置 LLM 算力<br><button class="btn" style="margin-top:12px" onclick="openRegister()">立即注册</button></div>';
    return;
  }
  try {
    const wq = '?wallet=' + encodeURIComponent(store.wallet);
    const stats = await api('GET','/api/llm/stats' + wq);
    let cfgHtml = '';
    try {
      const cfg = await api('GET','/api/llm/config' + wq);
      cfgHtml =
        '<div class="frow"><div class="field"><label>API Key（留空保留现有）</label><input id="llmKey" type="password" placeholder="'+esc(cfg.api_key_masked || 'sk-...')+'"></div>'+
        '<div class="field"><label>模型</label><input id="llmModel" value="'+esc(cfg.model || 'gpt-4o-mini')+'"></div></div>'+
        '<div class="frow"><div class="field"><label>Base URL</label><input id="llmBase" value="'+esc(cfg.base_url || 'https://api.openai.com/v1')+'"></div>'+
        '<div class="field"><label>每日限额（次）</label><input id="llmLimit" type="number" min="1" value="'+(cfg.daily_limit || 200)+'"></div></div>'+
        '<div class="frow"><div class="field"><label>启用</label><select id="llmEnabled"><option value="1">✅ 启用</option><option value="0">⏸️ 停用</option></select></div></div>'+
        '<div class="toolbar" style="margin-top:8px"><button class="btn btn-sm" onclick="saveLlmConfig()">💾 保存配置</button>'+
        '<button class="btn btn-sm" onclick="runLlmMining(\'task\')">⛏️ 任务挖矿</button>'+
        '<button class="btn btn-sm" onclick="runLlmMining(\'material\')">🧬 生成原料</button>'+
        '<button class="btn btn-sm" onclick="runLlmMining(\'memory\')">🧠 记忆优化</button>'+
        '<button class="btn btn-sm" onclick="runLlmMining(\'all\')">⚡ 全部执行</button></div>'+
        '<div class="sub" style="margin-top:6px">配置按当前钱包加密存储，仅本人可见；scheduled 每分钟自动执行「全部」模式</div>';
    } catch (e) {
      cfgHtml = '<div class="err-box" style="margin-top:6px">'+esc(e.message)+'</div>';
    }
    const byType = (stats.usage_by_type || []).map(u =>
      '<div class="kv"><span class="k">'+esc(u.task_type)+'</span><span class="v">'+u.calls+' 次 · '+((u.in_tokens||0)+(u.out_tokens||0))+' tokens</span></div>').join('');
    const logs = (stats.recent_logs || []).slice(0, 8).map(l =>
      '<div class="kv"><span class="k">'+esc(l.task_type)+(l.status === 'failed' ? ' <span class="badge b-err">失败</span>' : '')+'</span>'+
      '<span class="v">'+esc(llmShort(l.output_summary || l.input_summary || l.error_message || '', 32))+'</span></div>').join('');
    box.innerHTML =
      '<div class="grid grid-4">'+
        '<div class="stat"><div class="v">'+esc(stats.model || '未配置')+'</div><div class="k">模型</div></div>'+
        '<div class="stat"><div class="v">'+stats.daily_used+' / '+stats.daily_limit+'</div><div class="k">今日用量</div></div>'+
        '<div class="stat"><div class="v">'+stats.today.calls+'</div><div class="k">今日调用</div></div>'+
        '<div class="stat"><div class="v">'+(stats.enabled ? '✅ 运行中' : '⏸️ 停用')+'</div><div class="k">状态</div></div>'+
      '</div>'+
      cfgHtml +
      (byType ? '<div class="sub" style="margin-top:10px">近 '+stats.period_days+' 日按类型</div>'+byType : '') +
      (logs ? '<div class="sub" style="margin-top:10px">最近挖矿记录</div>'+logs : '');
  } catch (e) {
    box.innerHTML = errBox(e);
  }
}
async function saveLlmConfig() {
  const body = { wallet: store.wallet, daily_limit: parseInt($('llmLimit')?.value) || 200 };
  const key = ($('llmKey')?.value || '').trim();
  if (key) body.api_key = key;
  if ($('llmModel')?.value) body.model = $('llmModel').value.trim();
  if ($('llmBase')?.value) body.base_url = $('llmBase').value.trim();
  body.enabled = $('llmEnabled')?.value !== '0';
  try {
    await api('POST','/api/llm/config', body);
    toast('LLM 配置已保存','ok');
    renderLlmPanel($('llmPanelWallet') ? 'llmPanelWallet' : '');
  } catch(e) { toast(e.message,'err'); }
}
async function runLlmMining(mode) {
  try {
    const d = await api('POST','/api/llm/run',{ wallet: store.wallet, mode });
    toast('LLM 挖矿完成：任务 '+d.tasks_completed+' · 原料 '+d.materials_generated+' · 优化 '+d.memories_optimized + (d.limited ? '（今日额度已用完）' : ''),'ok');
    renderLlmPanel($('llmPanelWallet') ? 'llmPanelWallet' : ''); cacheBust(); refresh();
  } catch(e) { toast(e.message,'err'); }
}

/* ---------- 路由与导航 ---------- */
const NAV_GROUPS = [
  { label: '总览', items: [['dashboard','📊','仪表盘'],['wallet','👛','钱包'],['system','📈','系统'],['audit','📜','日志']] },
  { label: '分身与任务', items: [['agents','🤖','分身'],['tasks','📋','任务'],['workflow','🔀','工作流'],['broadcast','📢','广播']] },
  { label: '记忆与知识', items: [['memory','🧠','记忆'],['graph','🔮','图谱'],['heatmap','🌡️','热度'],['dialog','💬','对话']] },
  { label: '经济与治理', items: [['pool','🏦','系统池'],['mining','⛏️','挖矿'],['debt','💳','债务'],['governance','🏛️','治理']] },
  { label: '更多', items: [['tools','🧰','工具'],['chinese','🀄','文化'],['dev','🧪','调试']] },
];

function buildNav() {
  const nav = $('nav');
  nav.innerHTML = NAV_GROUPS.map(g =>
    '<div class="grp">'+g.label+'</div>' + g.items.map(([id, ic, label]) =>
      '<a class="nav-item" data-id="'+id+'" href="#/'+id+'"><span class="ic">'+ic+'</span><span class="lbl">'+label+'</span></a>').join('')
  ).join('');
}

function currentPage() {
  const hash = (location.hash || '#/dashboard').replace(/^#\/?/, '');
  return pages[hash] ? hash : 'dashboard';
}

async function refresh() {
  const id = currentPage();
  const pg = pages[id];
  if (!pg) return;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.id === id));
  const pageEl = $('page');
  pageEl.innerHTML = spinner('加载 '+pg.title+'…');
  try {
    pageEl.innerHTML = await pg.render();
  } catch (e) {
    pageEl.innerHTML = errBox(e);
  }
}

async function refreshAll() {
  cacheBust();
  toast('正在刷新全部数据…');
  await refresh();
}

/* ---------- 初始化 ---------- */
window.addEventListener('hashchange', refresh);
window.addEventListener('resize', () => {
  document.querySelectorAll('.nav-item .lbl').forEach(l => l.classList.toggle('show', window.innerWidth > 900));
});

async function init() {
  buildNav();
  refreshWalletLine();
  document.querySelectorAll('.nav-item .lbl').forEach(l => l.classList.toggle('show', window.innerWidth > 900));
  loadOrigins();
  await ensureProbed();
  if (store.currentIdx < 0 && store.origins.length === 0) {
    setConn('同源模式', true);
    $('snode').textContent = '同源';
    setStatus('就绪（同源）', true);
  } else if (store.currentIdx < 0) {
    setStatus('所有节点探测失败，回退同源', false);
  } else {
    setStatus('系统在线', true);
  }
  await refresh();
}

init();
</script>
</body>
